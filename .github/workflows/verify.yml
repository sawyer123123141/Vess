name: Verify Vess

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  behavior-preview:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install preview dependencies
        run: python -m pip install numpy pillow

      - name: Run behavior verification
        id: behavior
        shell: bash
        run: |
          set +e
          python tools/render_behavior_preview.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Add behavior summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/behavior-verification/summary.txt ]; then
            cat artifacts/behavior-verification/summary.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Behavior verification produced no summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload behavior artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vess-behavior-verification
          path: artifacts/behavior-verification/
          if-no-files-found: warn

      - name: Fail on behavior verification error
        if: always()
        shell: bash
        run: |
          code="${{ steps.behavior.outputs.exit_code }}"
          if [ -z "$code" ]; then
            code=2
          fi
          exit "$code"
